# 🎬 Daily Long Quran Video - صدقة جارية (السورة الكاملة)
# ينشئ فيديو طويلاً (سورة كاملة) كل يوم بالرسم العثماني المتزامن + خلفيات Pexels
# ويرفعه على يوتيوب كفيديو طويل (يستخدم LONG_YOUTUBE_* dual-project)
#
# التوقيت: 9:00 صباحاً UTC يومياً (12:00 ظهراً بتوقيت مكة/القاهرة)

name: 🎬 Daily Long Quran Video (Full Surah)

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (no YouTube upload)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: quran-long-video
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  YOUTUBE_CLIENT_ID: ${{ secrets.LONG_YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.LONG_YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.LONG_YOUTUBE_REFRESH_TOKEN }}

jobs:
  generate-long-video:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 🖼️ Setup Fonts (Amiri for Uthmani script)
        run: |
          mkdir -p fonts
          if [ ! -f "fonts/Amiri-Bold.ttf" ] || [ $(wc -c < "fonts/Amiri-Bold.ttf") -lt 100000 ]; then
            curl -L -s -o fonts/Amiri-Bold.ttf https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/amiri/Amiri-Bold.ttf || true
          fi
          ls -la fonts/ || true

      - name: 📦 Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements_auto.txt

      - name: 📁 Setup Directories
        run: |
          mkdir -p outputs/audio outputs/video backgrounds/cache

      - name: 🎬 Generate Long Quran Video (Full Surah)
        id: generate
        run: |
          echo "=== Python version ==="
          python --version
          echo "=== FFmpeg ==="
          ffmpeg -version | head -1
          echo "=== Engine modules check ==="
          python -c "import quran_engine, quran_data, pexels_api; print('✅ unified engine OK')"
          echo "=== Starting long generation ==="
          if [ "${{ github.event.inputs.test_mode }}" == "true" ]; then
            python auto_generate.py --long --test 2>&1 || true
          else
            python auto_generate.py --long 2>&1 || true
          fi
          echo "=== Output files ==="
          find outputs/ -type f -size +100k 2>/dev/null || echo "No large output files"

      - name: 💾 Save State
        run: |
          git config user.name "Quran Reels Bot"
          git config user.email "quran-reels-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "🎬 Long video state: $(date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main || git pull --rebase origin master || true
          git push || echo "⚠️ Push failed - state will be updated next run"

      - name: 📤 Upload Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-quran-video-${{ github.run_number }}
          path: outputs/video/*.mp4
          retention-days: 3

      - name: 📋 Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-video-log-${{ github.run_number }}
          path: auto_generate.log
          retention-days: 3

      - name: 📢 Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bot-failure'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🎬 Long video generation failed! - ' + new Date().toISOString().split('T')[0],
                body: `## ⚠️ Long-Video Workflow Failed\n\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n**Date:** ${new Date().toISOString()}\n\nCheck the logs for details.`,
                labels: ['bot-failure']
              });
            }
