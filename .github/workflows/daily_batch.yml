# 🔥 Daily Quran Batch - 3 Long Videos | صدقة جارية مدى الحياة
# ينشئ يومياً 3 فيديوهات طويلة بصوت الشيخ أحمد بن علي العجمي:
#   [1] سورة كاملة بالنص العثماني المتزامن
#   [2] تجميع سور قرآنية
#   [3] رقية شرعية بكتاب الله
# خلفيات طبيعية نقية 100% من Pexels (لا بشر ولا كائنات حية)

name: 🔥 Daily Quran Scheduler (3 Videos Daily · Sheikh Ajamy)

on:
  schedule:
    - cron: '0 3 * * *'   # 06:00 ص مكة/القاهرة (الفيديو 1: سورة كاملة)
    - cron: '0 10 * * *'  # 01:00 م مكة/القاهرة (الفيديو 2: تجميع سور)
    - cron: '0 17 * * *'  # 08:00 م مكة/القاهرة (الفيديو 3: رقية شرعية)
  workflow_dispatch:
    inputs:
      job:
        description: 'Video to generate: auto (by time), surah, compilation, ruqyah, or batch'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - surah
          - compilation
          - ruqyah
          - batch
      test_mode:
        description: 'Run in test mode (no YouTube upload)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: quran-daily-batch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || 'Pif69uZYXbs3XCMfLCUSgkfiD3TaGD8yT8NOQWlSeN1WmUFljCRu1Wnf' }}
  LONG_YOUTUBE_CLIENT_ID: ${{ secrets.LONG_YOUTUBE_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID }}
  LONG_YOUTUBE_CLIENT_SECRET: ${{ secrets.LONG_YOUTUBE_CLIENT_SECRET || secrets.YOUTUBE_CLIENT_SECRET }}
  LONG_YOUTUBE_REFRESH_TOKEN: ${{ secrets.LONG_YOUTUBE_REFRESH_TOKEN || secrets.YOUTUBE_REFRESH_TOKEN }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID || secrets.LONG_YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET || secrets.LONG_YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || secrets.LONG_YOUTUBE_REFRESH_TOKEN }}

jobs:
  generate-daily-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 🖼️ Setup Fonts (Amiri for Uthmani script)
        run: |
          mkdir -p fonts
          if [ ! -f "fonts/Amiri-Bold.ttf" ] || [ $(wc -c < "fonts/Amiri-Bold.ttf") -lt 100000 ]; then
            curl -L -s -o fonts/Amiri-Bold.ttf https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/amiri/Amiri-Bold.ttf || true
          fi
          if [ ! -f "fonts/Lalezar-Regular.ttf" ] || [ $(wc -c < "fonts/Lalezar-Regular.ttf") -lt 10000 ]; then
            curl -L -s -o fonts/Lalezar-Regular.ttf https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/lalezar/Lalezar-Regular.ttf || true
          fi
          ls -la fonts/ || true

      - name: 📦 Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements_auto.txt

      - name: 📁 Setup Directories
        run: |
          mkdir -p outputs/audio outputs/video backgrounds/cache

      - name: 🎬 Generate & Publish Quran Video (Sheikh Ajamy)
        run: |
          echo "=== Python ===" && python --version
          echo "=== FFmpeg ===" && ffmpeg -version | head -1
          echo "=== Engine modules check ==="
          python -c "import quran_engine, quran_data, pexels_api, ruqyah_data; print('✅ unified engine OK')"
          
          JOB_ARG="${{ github.event.inputs.job || 'auto' }}"
          TEST_ARG=""
          if [ "${{ github.event.inputs.test_mode }}" == "true" ]; then
            TEST_ARG="--test"
          fi
          
          echo "=== Running Quran Video Job: $JOB_ARG ==="
          python auto_generate.py --job "$JOB_ARG" $TEST_ARG 2>&1 || true

      - name: 💾 Save State
        run: |
          git config user.name "Quran Reels Bot"
          git config user.email "quran-reels-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "🔥 Video state updated: $(date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main || true
          git push || echo "⚠️ Push failed - state will be updated next run"

      - name: 📋 Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-batch-log-${{ github.run_number }}
          path: auto_generate.log
          retention-days: 3

      - name: 📢 Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bot-failure'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔥 Daily batch failed! - ' + new Date().toISOString().split('T')[0],
                body: `## ⚠️ Daily Batch Workflow Failed\n\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n**Date:** ${new Date().toISOString()}\n\nCheck the logs for details.`,
                labels: ['bot-failure']
              });
            }
