# 🔥 Daily Quran Batch - 3 Long Videos | صدقة جارية مدى الحياة
# ينشئ يومياً 3 فيديوهات طويلة بصوت الشيخ أحمد بن علي العجمي:
#   [1] سورة كاملة بالنص العثماني المتزامن
#   [2] تجميع سور قرآنية
#   [3] رقية شرعية بكتاب الله
# خلفيات طبيعية نقية 100% من Pexels (لا بشر ولا كائنات حية)

name: 🔥 Daily Quran Batch (3 Long Videos · Ajamy)

on:
  schedule:
    - cron: '0 9 * * *'   # يومياً 9:00 UTC (12:00 ظهراً مكة/القاهرة)
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (no YouTube upload)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: quran-daily-batch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  LONG_YOUTUBE_CLIENT_ID: ${{ secrets.LONG_YOUTUBE_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID }}
  LONG_YOUTUBE_CLIENT_SECRET: ${{ secrets.LONG_YOUTUBE_CLIENT_SECRET || secrets.YOUTUBE_CLIENT_SECRET }}
  LONG_YOUTUBE_REFRESH_TOKEN: ${{ secrets.LONG_YOUTUBE_REFRESH_TOKEN || secrets.YOUTUBE_REFRESH_TOKEN }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID || secrets.LONG_YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET || secrets.LONG_YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || secrets.LONG_YOUTUBE_REFRESH_TOKEN }}

jobs:
  generate-daily-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 200

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 🖼️ Setup Fonts (Amiri for Uthmani script)
        run: |
          mkdir -p fonts
          if [ ! -f "fonts/Amiri-Bold.ttf" ] || [ $(wc -c < "fonts/Amiri-Bold.ttf") -lt 100000 ]; then
            curl -L -s -o fonts/Amiri-Bold.ttf https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/amiri/Amiri-Bold.ttf || true
          fi
          ls -la fonts/ || true

      - name: 📦 Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements_auto.txt

      - name: 📁 Setup Directories
        run: |
          mkdir -p outputs/audio outputs/video backgrounds/cache

      - name: 🎬 Generate Daily Batch (3 Long Videos · Sheikh Ajamy)
        run: |
          echo "=== Python ===" && python --version
          echo "=== FFmpeg ===" && ffmpeg -version | head -1
          echo "=== Engine modules check ==="
          python -c "import quran_engine, quran_data, pexels_api, ruqyah_data; print('✅ unified engine OK')"
          echo "=== Starting daily batch (surah + compilation + ruqyah) ==="
          if [ "${{ github.event.inputs.test_mode }}" == "true" ]; then
            python auto_generate.py --batch --test 2>&1 || true
          else
            python auto_generate.py --batch 2>&1 || true
          fi
          echo "=== Output videos ==="
          find outputs/video -name "*.mp4" -type f -printf "%s\t%p\n" 2>/dev/null | sort -rn | head -10 || echo "No videos"

      - name: 💾 Save State
        run: |
          git config user.name "Quran Reels Bot"
          git config user.email "quran-reels-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "🔥 Daily batch state: $(date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main || true
          git push || echo "⚠️ Push failed - state will be updated next run"

      - name: 📤 Upload Videos Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-batch-videos-${{ github.run_number }}
          path: outputs/video/*.mp4
          retention-days: 3

      - name: 📋 Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-batch-log-${{ github.run_number }}
          path: auto_generate.log
          retention-days: 3

      - name: 📢 Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bot-failure'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔥 Daily batch failed! - ' + new Date().toISOString().split('T')[0],
                body: `## ⚠️ Daily Batch Workflow Failed\n\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n**Date:** ${new Date().toISOString()}\n\nCheck the logs for details.`,
                labels: ['bot-failure']
              });
            }
