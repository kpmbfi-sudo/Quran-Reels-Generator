# Daily Quran Reels Generator - صدقة جارية
# Automatically generates and uploads Quran reels to YouTube every day
# Runs at 6:00 AM UTC (10:00 AM GST / Gulf Time) every day
# Also runs at 6:00 PM UTC (10:00 PM GST) for a second daily reel

name: 📖 Daily Quran Reel Generator

on:
  # Run twice daily: 6 AM and 6 PM UTC
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (no YouTube upload)'
        required: false
        default: 'false'
        type: boolean

# Prevent concurrent runs
concurrency:
  group: quran-reel-generator
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

jobs:
  generate-quran-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # Step 1: Checkout repository
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # Step 2: Setup Python
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step 3: Install FFmpeg
      - name: 🎬 Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # Step 4: Setup Fonts & Tools
      - name: 🖼️ Setup Fonts & Tools
        run: |
          mkdir -p fonts
          if [ ! -f "fonts/Amiri-Bold.ttf" ] || [ $(wc -c < "fonts/Amiri-Bold.ttf") -lt 10000 ]; then
            curl -L -s -o fonts/Amiri-Bold.ttf https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/amiri/Amiri-Bold.ttf || true
          fi

      # Step 5: Install Python dependencies
      - name: 📦 Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements_auto.txt

      # Step 6: Create required directories
      - name: 📁 Setup Directories
        run: |
          mkdir -p outputs/audio outputs/video

      # Step 7: Generate the Quran Reel
      - name: 📖 Generate Quran Reel
        run: |
          echo "=== Python version ==="
          python --version
          echo "=== Installed packages ==="
          pip list
          echo "=== FFmpeg version ==="
          ffmpeg -version | head -1
          echo "=== Font files ==="
          ls -la fonts/ || echo "No fonts directory"
          echo "=== Starting generation ==="
          if [ "${{ github.event.inputs.test_mode }}" == "true" ]; then
            python auto_generate.py --test 2>&1 || true
          else
            python auto_generate.py 2>&1 || true
          fi
          echo "=== Generation log ==="
          cat auto_generate.log 2>/dev/null || echo "No log file"
          echo "=== Output files ==="
          find outputs/ -type f 2>/dev/null || echo "No output files"
          # Check if video was created
          if ls outputs/video/*.mp4 1>/dev/null 2>&1; then
            echo "✅ Video created successfully!"
          else
            echo "❌ No video created. Check logs above."
            exit 1
          fi

      # Step 8: Save state back to repository (with rebase to avoid conflicts)
      - name: 💾 Save State
        run: |
          git config user.name "Quran Reels Bot"
          git config user.email "quran-reels-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "📖 Auto-update state: $(date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main || git pull --rebase origin master || true
          git push || echo "⚠️ Push failed - state will be updated next run"

      # Step 9: Upload video as artifact (for debugging)
      - name: 📤 Upload Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quran-reel-${{ github.run_number }}
          path: outputs/video/*.mp4
          retention-days: 7

      # Step 10: Upload log for debugging
      - name: 📋 Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generation-log-${{ github.run_number }}
          path: auto_generate.log
          retention-days: 7

      # Step 11: Create issue on failure for notification
      - name: 📢 Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bot-failure'
            });
            // Only create if no recent open issue
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '❌ Quran Reel generation failed! - ' + new Date().toISOString().split('T')[0],
                body: `## ⚠️ Workflow Failed\n\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n**Date:** ${new Date().toISOString()}\n\nPlease check the logs for details.`,
                labels: ['bot-failure']
              });
            }
